name: Build and test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Exact merged source commit
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify source revision
        if: inputs.source != ''
        env:
          EXPECTED_SOURCE: ${{ inputs.source }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SOURCE"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/playwright-core/cli.js install --with-deps chromium
          executable_path="$(node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath())")"
          echo "CHROMIUM_EXECUTABLE_PATH=$executable_path" >> "$GITHUB_ENV"

      - name: Validate release metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises"

          const core = JSON.parse(await readFile("packages/core/package.json", "utf8"))
          const opencode = JSON.parse(await readFile("packages/opencode/package.json", "utf8"))
          if (opencode.dependencies[core.name] !== `^${core.version}`) {
            throw new Error(`${opencode.name} must depend on ${core.name} at ^${core.version}`)
          }
          NODE

      - name: Check and test
        run: npm run check

      - name: Validate Claude marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.239 plugin validate packages/claude --strict
          npx --yes @anthropic-ai/claude-code@2.1.239 plugin validate . --strict
